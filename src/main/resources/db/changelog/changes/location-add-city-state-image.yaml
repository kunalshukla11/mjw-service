databaseChangeLog:
  - changeSet:
      id: add-city-state-image-to-location
      author: narendra
      changes:
        - dropColumn:
            tableName: location
            schemaName: mjw_service
            columnName: images_url
        - addColumn:
            tableName: location
            schemaName: mjw_service
            columns:
              - column:
                  name: city_image_url
                  type: VARCHAR(1000)
              - column:
                    name: state_image_url
                    type: VARCHAR(1000)
              - column:
                  name: country_image_url
                  type: VARCHAR(1000)